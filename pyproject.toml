[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drg"
version = "1.0.0"
description = "Dynamic Resilient Grid (DRG): AI-driven local electricity demand forecasting and electrification stress analysis for UK urban networks"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
authors = [{ name = "DRG Project" }]

dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "pyarrow>=14",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "xgboost>=2.0",
  "statsmodels>=0.14",
  "shap>=0.44",
  "matplotlib>=3.8",
  "plotly>=5.18",
  "streamlit>=1.32",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "requests>=2.31",
  "requests-cache>=1.2",
  "tenacity>=8.2",
  "python-dotenv>=1.0",
  "PyYAML>=6.0",
  "joblib>=1.3",
  "typer>=0.12",
  "rich>=13.7",
]

[project.optional-dependencies]
deep = ["torch>=2.2"]
azure = [
  "azure-identity>=1.16",
  "azure-storage-blob>=12.19",
  "azure-keyvault-secrets>=4.8",
  "adlfs>=2024.2.0",
  "applicationinsights>=0.11.10",
  "opencensus-ext-azure>=1.1.13",
  "azure-ai-ml>=1.15",
  "mlflow>=2.11",
]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4", "black>=24.3", "ipykernel>=6.29"]

[project.scripts]
drg = "drg.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]
