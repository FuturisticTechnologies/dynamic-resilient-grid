$schema: https://azuremlschemas.azureedge.net/latest/managedOnlineDeployment.schema.json
name: blue
endpoint_name: drg-forecast
model: azureml:drg-champion@latest
environment: azureml:drg-training-env@latest
code_configuration:
  code: ../../
  scoring_script: pipelines/score.py
instance_type: Standard_DS3_v2
instance_count: 1
request_settings:
  request_timeout_ms: 30000
  max_concurrent_requests_per_instance: 4
liveness_probe:
  initial_delay: 30
  period: 30
